name: publish-npm

# 发布方式 B：npm Trusted Publishing（OIDC，无需 token / 2FA）
# 需要在 npm 包设置里配置 Trusted Publisher：
#   Package → Settings → Trusted Publisher → GitHub Actions
#   Repository: zxcvbnmlxy/dsh-netease-daily
#   Workflow filename: publish-npm.yml
# 之后打 tag 或手动触发即可发布，npm 会校验 OIDC 身份并生成 provenance。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing needs npm >= 11.5)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Publish
        run: npm publish --provenance --access public
